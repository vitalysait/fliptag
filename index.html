<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #12121c;
    color: #fff;
    padding: 20px;
  }

  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: .5px; opacity: .9; }

  .stage {
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #soundButton {
    position: relative;
    width: 180px;
    height: 180px;
    border: none;
    border-radius: 50%;
    background: #202038;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, box-shadow .15s ease;
    padding: 0;
  }

  #soundButton img, #soundButton svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  #soundButton:hover { transform: scale(1.04); box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #soundButton:active { transform: scale(.96); }

  #soundButton.playing { box-shadow: 0 0 0 6px rgba(255,255,255,.12); }

  .pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    animation: none;
  }
  #soundButton.playing .pulse {
    border: 4px solid rgba(76, 217, 100, .7);
    animation: ring 1.1s ease-out infinite;
  }

  @keyframes ring {
    0%   { transform: scale(1);     opacity: .9; }
    100% { transform: scale(1.45);  opacity: 0; }
  }

  .lock-panel {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #codeInput {
    padding: 12px 16px;
    font-size: 1rem;
    border: 1px solid #3a3a55;
    border-radius: 12px;
    background: #26263c;
    color: #fff;
    outline: none;
    text-align: center;
    letter-spacing: 2px;
  }
  #codeInput:focus { border-color: #4c4c6e; }

  .btn {
    padding: 12px 22px;
    font-size: 1rem;
    border: 1px solid #3a3a55;
    border-radius: 12px;
    background: #26263c;
    color: #fff;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: #33334c; border-color: #4c4c6e; }
  .btn.danger:hover { background: #4a2226; border-color: #8a4a52; }

  .status { font-size: .9rem; opacity: .8; min-height: 1.2em; }
  .status.error { color: #ff6b6b; }
  .status.ok { color: #4cd964; }

  .video-box {
    width: 480px;
    max-width: 92vw;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    display: none;
  }
  .video-box.show { display: block; }
  .video-box video { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>

  <h1>Sound Button</h1>

  <div class="stage">
    <button id="soundButton" title="Звук включён навсегда (выключить можно только кодом)">
      <div class="pulse"></div>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="50" fill="#4cd964"/>
        <path d="M38 62V38l30 24z" fill="#0b0b12"/>
        <circle cx="62" cy="38" r="5" fill="#fff" opacity=".85"/>
        <circle cx="72" cy="50" r="5" fill="#fff" opacity=".85"/>
        <circle cx="66" cy="64" r="5" fill="#fff" opacity=".85"/>
      </svg>
    </button>
  </div>

  <div class="video-box" id="videoBox">
    <video id="videoEl" loop playsinline muted></video>
  </div>

  <p class="status" id="status"></p>

  <div class="actions">
    <button class="btn" id="videoBtn">🎬 Видео: выкл</button>
  </div>

  <div class="lock-panel">
    <input type="password" id="codeInput" placeholder="Код выключения" inputmode="numeric" maxlength="6">
    <button class="btn danger" id="stopBtn">Выключить</button>
  </div>

<script>
  const button = document.getElementById('soundButton');
  const codeInput = document.getElementById('codeInput');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  const STOP_CODE = '38406';
  let audio = null;

  /* ---------- дефолтный звук (генерируется) ---------- */
  function beepWavBlob() {
    const sr = 44100, dur = 0.6, n = Math.floor(sr * dur);
    const buffer = new ArrayBuffer(44 + n * 2);
    const view = new DataView(buffer);
    const w = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); w(8, 'WAVE');
    w(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, 1, true); view.setUint32(24, sr, true);
    view.setUint32(28, sr * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    w(36, 'data'); view.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const env = Math.min(1, t * 6) * Math.max(0, 1 - t / dur * 1.3);
      const v = Math.sin(2 * Math.PI * 880 * t) * env * 32000;
      view.setInt16(44 + i * 2, v, true);
    }
    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  }

  let soundUrl = null;
  let defaultBeep = null;

  const videoBox = document.getElementById('videoBox');
  const videoEl = document.getElementById('videoEl');
  const videoBtn = document.getElementById('videoBtn');
  let videoUrl = null;
  let videoOn = false;

  function setVideoEnabled(enabled) {
    videoOn = enabled;
    videoBtn.textContent = videoOn ? '🎬 Видео: вкл' : '🎬 Видео: выкл';
    if (videoOn && videoUrl) {
      videoBox.classList.add('show');
      videoEl.src = videoUrl;
      videoEl.play().catch(() => {});
    } else {
      videoBox.classList.remove('show');
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
    }
  }

  async function loadConfig() {
    try {
      const res = await fetch('config.json', { cache: 'no-store' });
      const cfg = await res.json();
      if (cfg.image) {
        for (const el of [...button.querySelectorAll('img, svg')]) el.remove();
        const img = document.createElement('img');
        img.src = cfg.image;
        button.appendChild(img);
      }
      if (cfg.sound) soundUrl = cfg.sound;
      if (cfg.video) videoUrl = cfg.video;
      setVideoEnabled(!!cfg.video && !!cfg.video_on);
    } catch (e) {}
    defaultBeep = beepWavBlob();
  }

  videoBtn.addEventListener('click', () => {
    if (!videoUrl) {
      status.className = 'status error';
      status.textContent = 'Видео ещё не загружено — отправь его боту в Telegram.';
      return;
    }
    setVideoEnabled(!videoOn);
  });

  /* ---------- звук ---------- */
  let playAttempted = false;

  function startSound() {
    if (!audio) {
      audio = new Audio(soundUrl || defaultBeep);
      audio.loop = true;
      audio.addEventListener('error', () => { audio = null; playAttempted = false; });
    }
    audio.currentTime = 0;
    const p = audio.play();
    if (p && typeof p.then === 'function') {
      p.then(() => {
        button.classList.add('playing');
      }).catch(() => {
        audio = null;
        playAttempted = false;
      });
    }
    playAttempted = true;
  }

  function stopSound() {
    if (audio) { audio.pause(); audio.currentTime = 0; audio = null; }
    button.classList.remove('playing');
    localStorage.removeItem('sb_on');
  }

  stopBtn.addEventListener('click', tryStop);
  codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryStop(); });

  function tryStop() {
    if (codeInput.value.trim() === STOP_CODE) {
      stopSound();
      status.className = 'status ok';
      status.textContent = 'Звук выключен.';
    } else {
      status.className = 'status error';
      status.textContent = 'Неверный код.';
    }
    codeInput.value = '';
  }

  /* ---------- кнопка ---------- */
  button.addEventListener('click', () => {
    startSound();
    localStorage.setItem('sb_on', '1');
  });

  /* ---------- загрузка ---------- */
  (async () => {
    await loadConfig();
    if (localStorage.getItem('sb_on') === '1') startSound();
  })();
</script>
</body>
</html>
